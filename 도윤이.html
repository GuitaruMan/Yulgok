<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>도윤이 - Yulgok</title>
<style>
  :root { --bg: #f5f6f8; --card: #ffffff; --ink: #1c2230; --ink-soft: #5b6270; --accent: #3a5ba0; --shadow: rgba(28, 34, 48, 0.10); }
  @media (prefers-color-scheme: dark) { :root { --bg: #14161c; --card: #1f232c; --ink: #eceef2; --ink-soft: #a3aab8; --accent: #7fa2e0; --shadow: rgba(0,0,0,0.4); } }
  :root[data-theme="dark"] { --bg: #14161c; --card: #1f232c; --ink: #eceef2; --ink-soft: #a3aab8; --accent: #7fa2e0; --shadow: rgba(0,0,0,0.4); }
  :root[data-theme="light"] { --bg: #f5f6f8; --card: #ffffff; --ink: #1c2230; --ink-soft: #5b6270; --accent: #3a5ba0; --shadow: rgba(28, 34, 48, 0.10); }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif; display: flex; flex-direction: column; align-items: center; padding: 6vh 5vw 4vh; }
  .top { width: 100%; max-width: 700px; margin-bottom: 1.5rem; display: flex; justify-content: space-between; }
  a.back { color: var(--ink-soft); text-decoration: none; font-size: 0.9rem; }
  a.back:hover { color: var(--accent); }
  h1 { font-size: 1.6rem; margin: 0.5rem 0 2.5rem; }
  .list { width: 100%; max-width: 700px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.1rem; }
  a.item {
    background: var(--card); border-radius: 22px; padding: 1rem 0.8rem; aspect-ratio: 1;
    text-decoration: none; color: var(--ink); box-shadow: 0 3px 12px var(--shadow);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.6rem;
    text-align: center; transition: transform 0.15s ease; overflow: hidden;
  }
  a.item:hover { transform: translateY(-4px); }
  .doc-icon { font-size: 3.4rem; line-height: 1; }
  .item-text { display: flex; flex-direction: column; gap: 0.2rem; }
  .item-text .t { font-weight: 700; font-size: 1.02rem; line-height: 1.3; word-break: keep-all; }
  .item-text .s { font-size: 0.78rem; color: var(--ink-soft); line-height: 1.35; word-break: keep-all;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  @media (max-width: 520px) { .list { grid-template-columns: repeat(2, 1fr); } .doc-icon { font-size: 2.6rem; } }
</style>
</head>
<body>

  </div>

      <span class="item-text">
        <span class="t">수학 더하기 빼기</span>
        <span class="s">받아올림·받아내림 · 세 수 계산 · 생각 문제 (초등 1학년)</span>
      </span>
    </a>
    <a class="item" href="도윤이/영어_파닉스2.html">
      <span class="doc-icon">🚀</span>
      <span class="item-text">
        <span class="t">영어 파닉스 2단계</span>
        <span class="s">새 단어 85개 · sh ch th · 긴 단어 (발음 듣기)</span>
      </span>
    </a>
    <a class="item" href="도윤이/영어_파닉스.html">
      <span class="doc-icon">🔤</span>
      <span class="item-text">
        <span class="t">영어 파닉스 게임</span>
        <span class="s">알파벳 소리 · 쉬운 단어 (발음 듣기)</span>
      </span>
    </a>
  </div>
</body>
</html>
