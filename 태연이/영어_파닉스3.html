<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>영어 파닉스 3단계 - My Presentations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Jua&family=Noto+Sans+KR:wght@400;500;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#3a2236;--sub:#7a5f74;--line:#f0d5e0;--bg1:#FFE4EE;--bg2:#FFF8FB;--c:#F0508A;--cl:#FFEDF4;--cd:#B32A60;--gr:#EBC3D3;
  --ok:#1FA65A;--okl:#E3F7EB;--no:#E5484D;--nol:#FFECEE;--gold:#FFB020}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:17px}
body{font-family:'Nunito','Noto Sans KR','Malgun Gothic',sans-serif;color:var(--ink);min-height:100vh;line-height:1.5;
  background:linear-gradient(180deg,var(--bg1),var(--bg2) 420px) no-repeat,var(--bg2);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
#app{max-width:1060px;margin:0 auto;padding:0 22px 70px}
.j{font-family:'Jua','Malgun Gothic',sans-serif}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 17px;border-radius:14px;background:#fff;font-weight:800;font-size:.95rem;
  border:2px solid var(--gr);box-shadow:0 4px 0 var(--gr);transition:transform .08s,box-shadow .08s;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{filter:brightness(1.03)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gr)}
.btn.pri{background:var(--c);border-color:var(--cd);color:#fff;box-shadow:0 4px 0 var(--cd)}
.btn.pri:active{box-shadow:0 1px 0 var(--cd)}
.btn.big{font-size:1.1rem;padding:13px 26px;border-radius:18px}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--sub);font-weight:700}
.tg{font-family:'Fredoka','Jua';font-weight:700;font-size:.75rem;background:var(--c);color:#fff;border-radius:99px;padding:2px 11px;white-space:nowrap}

/* top bar */
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;position:sticky;top:0;z-index:30;padding:12px 0 10px;
  background:linear-gradient(var(--bg1) 78%,rgba(255,228,238,0))}
.bar .home,.foot .home{background:#4A2040;border-color:#2E0F28;color:#fff;box-shadow:0 4px 0 #2E0F28}
.bar .home:active{box-shadow:0 1px 0 #2E0F28}
.bar .nav{display:flex;gap:6px;flex-wrap:wrap}
.bar .nav a{display:inline-flex;align-items:center;gap:5px;text-decoration:none;color:var(--ink);font-weight:800;font-size:.85rem;padding:7px 12px;border-radius:12px;
  background:#fff;border:2px solid var(--nc);box-shadow:0 3px 0 var(--nc)}
.bar .nav a.on{background:var(--nc);color:#fff}
.bar .nav a:active{transform:translateY(2px);box-shadow:0 1px 0 var(--nc)}
.bar .sp{flex:1}
.bar .tot{font-family:'Fredoka';font-weight:700;background:#fff;border-radius:99px;padding:6px 14px;border:2px solid var(--gold);color:#8a5a00;font-size:.9rem;white-space:nowrap}
.bar .snd{width:40px;height:40px;border-radius:50%;background:#fff;border:2px solid var(--gr);font-size:1.05rem}

/* home */
.hero{background:linear-gradient(135deg,#F0508A,#FF8A5B);color:#fff;border-radius:28px;padding:30px 36px 34px;position:relative;overflow:hidden;margin-top:18px;
  box-shadow:0 8px 0 #B8456A}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.12)}
.hero::before{width:260px;height:260px;right:-60px;top:-90px}.hero::after{width:130px;height:130px;right:170px;bottom:-50px}
.hero .tags{display:flex;gap:7px;align-items:center;flex-wrap:wrap;font-size:.85rem}
.hero .tags b{font-family:'Fredoka';font-weight:600;background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.7);border-radius:99px;padding:1px 13px}
.hero .who{font-family:'Jua';font-size:1.5rem;margin-top:16px;line-height:1}
.hero h1{font-family:'Fredoka';font-weight:700;font-size:3.3rem;line-height:1.02;letter-spacing:-1px;margin-top:6px}
.hero h1 span{color:#FFF3A0}
.hero .units{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap;position:relative;z-index:2}
.hero .units div{background:#fff;color:var(--ink);border-radius:11px;padding:3px 14px;font-family:'Fredoka';font-weight:500}
.hero .units b{color:#F0508A;margin-right:6px}
.hero svg{position:absolute;right:44px;top:34px;width:150px;z-index:2;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(3deg)}}
.meter{display:flex;align-items:center;gap:14px;background:#fff;border-radius:20px;padding:14px 22px;margin-top:20px;border:2px solid var(--line)}
.meter .lab{font-family:'Jua';font-size:1.1rem;white-space:nowrap}
.meter .track{flex:1;height:18px;border-radius:99px;background:#FBEFF4;overflow:hidden}
.meter .fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#FFD166,#FFB020);transition:width .6s}
.meter .num{font-family:'Fredoka';font-weight:700;color:#8a5a00;white-space:nowrap}
.clear{background:#FFF6DF;border:3px solid var(--gold);border-radius:22px;padding:18px;text-align:center;margin-top:18px}
.clear h2{font-family:'Fredoka';font-weight:700;font-size:1.9rem;color:#A96A00;letter-spacing:1px}
.map{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-top:20px}
.mp{display:block;text-decoration:none;color:var(--ink);background:#fff;border:3px solid var(--c);border-radius:24px;padding:20px 18px 16px;text-align:center;
  box-shadow:0 7px 0 var(--cd);transition:transform .1s,box-shadow .1s;position:relative}
.mp:hover{transform:translateY(-3px);box-shadow:0 10px 0 var(--cd)}
.mp:active{transform:translateY(4px);box-shadow:0 3px 0 var(--cd)}
.mp .ico{width:68px;height:68px;border-radius:50%;background:var(--cl);margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:2rem}
.mp h3{font-family:'Jua';font-weight:400;font-size:1.55rem;line-height:1.2;margin-top:6px}
.mp .nk{font-family:'Fredoka';font-weight:600;color:var(--c);font-size:.95rem}
.mp p{font-size:.82rem;color:var(--sub);margin:6px 0 10px;min-height:2.6em;line-height:1.4}
.mp .pg{height:10px;border-radius:99px;background:var(--cl);overflow:hidden}
.mp .pg i{display:block;height:100%;background:var(--c);border-radius:99px}
.mp .cnt{font-family:'Fredoka';font-weight:600;font-size:.85rem;color:var(--cd);margin-top:5px}
.mp .done{position:absolute;right:-8px;top:-10px;background:var(--gold);color:#fff;font-family:'Fredoka';font-weight:700;border-radius:99px;padding:3px 12px;font-size:.8rem;transform:rotate(8deg);box-shadow:0 3px 0 #b97f00}
.foot{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:26px}
.foot .sp{flex:1}
.cred{margin-top:22px;font-size:.78rem;color:var(--sub)}
.cred summary{cursor:pointer;font-weight:700}
.cred p{margin-top:6px;line-height:1.6}

/* stage list */
.sth{display:flex;align-items:center;gap:14px;margin:10px 0 18px}
.sth .ico{width:64px;height:64px;border-radius:50%;background:#fff;border:3px solid var(--c);display:flex;align-items:center;justify-content:center;font-size:1.9rem;flex:none}
.sth h1{font-family:'Jua';font-weight:400;font-size:2rem;line-height:1.1}
.sth h1 em{font-family:'Fredoka';font-style:normal;font-weight:600;font-size:1.1rem;color:var(--c);margin-left:8px}
.sth p{color:var(--sub);font-size:.9rem}
.acts{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.ac{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--ink);background:#fff;border:3px solid var(--c);border-radius:20px;padding:14px 18px;
  box-shadow:0 6px 0 var(--cd);transition:transform .1s,box-shadow .1s}
.ac:hover{transform:translateY(-2px);box-shadow:0 8px 0 var(--cd)}
.ac:active{transform:translateY(4px);box-shadow:0 2px 0 var(--cd)}
.ac .no{font-family:'Fredoka';font-weight:700;color:#fff;background:var(--c);width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.ac .e{font-size:1.9rem;flex:none}
.ac .t{flex:1;min-width:0}
.ac .t b{font-family:'Jua';font-weight:400;font-size:1.15rem;display:block;line-height:1.25}
.ac .t span{font-size:.8rem;color:var(--sub)}
.ac .k{font-family:'Fredoka','Jua';font-size:.7rem;font-weight:700;border-radius:99px;padding:1px 9px;background:var(--cl);color:var(--cd);margin-left:6px;vertical-align:2px}
.stars{font-size:1.25rem;letter-spacing:2px;white-space:nowrap;color:#e6d3dc}
.stars b{color:var(--gold);font-weight:400}

/* activity */
.crumb{display:flex;align-items:center;gap:12px;margin:6px 0 14px;flex-wrap:wrap}
.crumb h1{font-family:'Jua';font-weight:400;font-size:1.55rem;line-height:1.2;flex:1;min-width:200px}
.play{background:#fff;border:3px solid var(--c);border-radius:26px;padding:24px 28px 28px;box-shadow:0 7px 0 var(--cd);min-height:420px}
.guide{color:var(--sub);font-size:.95rem;margin-bottom:14px}
.guide b{color:var(--cd)}
.prog-wrap{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.prog{flex:1;height:12px;border-radius:99px;background:var(--cl);overflow:hidden}
.prog-in{height:100%;width:0;background:var(--c);border-radius:99px;transition:width .35s}
.prog-lab{font-family:'Fredoka';font-weight:600;color:var(--cd);font-size:.9rem;white-space:nowrap}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.pop{animation:pop .3s}
@keyframes pop{50%{transform:scale(1.12)}}
.donebar{display:flex;justify-content:center;margin-top:24px}

/* listen question */
.lq{text-align:center}
.lqh{display:flex;align-items:center;justify-content:center;gap:22px}
.lqh .pe{font-size:5rem;line-height:1.1}
.spk{width:88px;height:88px;border-radius:50%;background:var(--c);color:#fff;font-size:2.4rem;box-shadow:0 6px 0 var(--cd);flex:none}
.spk:active{transform:translateY(4px);box-shadow:0 2px 0 var(--cd)}
.wd{font:600 3.6rem/1.2 'Fredoka';letter-spacing:6px;margin-top:10px;color:var(--ink)}
.wd i{font-style:normal;display:inline-block;min-width:.9em;border-bottom:6px solid var(--c);color:var(--c)}
.wd b{color:var(--ok)}
.opts{display:grid;gap:14px;margin:22px auto 0;max-width:720px}
.opt{background:#fff;border:3px solid var(--gr);border-radius:20px;padding:12px 10px;box-shadow:0 5px 0 var(--gr);transition:transform .08s;line-height:1.2}
.opt:hover{border-color:var(--c)}
.opt:active{transform:translateY(3px);box-shadow:0 2px 0 var(--gr)}
.opt .lt{display:block;font:600 2.6rem/1.1 'Fredoka'}
.opt small{display:block;font:700 1.6rem 'Noto Sans KR';color:var(--sub);margin-top:4px}
.opt.pic{font-size:4rem;line-height:1.2}
.opt.ok{border-color:var(--ok);background:var(--okl);box-shadow:0 5px 0 var(--ok);color:#14703d}
.opt.no{border-color:var(--no);background:var(--nol);box-shadow:0 5px 0 var(--no);color:#a52328;opacity:.6}
.opt[disabled]{pointer-events:none}

/* letter cards */
.grp{font-family:'Jua';font-size:1.15rem;color:var(--cd);margin:22px 0 12px;display:flex;align-items:center;gap:10px}
.grp:first-child{margin-top:0}
.grp::after{content:"";flex:1;border-bottom:2px dashed var(--c);opacity:.5}
.lgd{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.lc{background:#fff;border:3px solid var(--c);border-radius:20px;box-shadow:0 5px 0 var(--cd);text-align:center;padding:12px 6px;position:relative}
.lc:active{transform:translateY(3px);box-shadow:0 2px 0 var(--cd)}
.lc .L{font:600 2.5rem/1 'Fredoka';color:var(--cd)}
.lc .L small{font-size:1.8rem;color:var(--c);margin-left:5px}
.lc .hk,.vw{font:700 1.2rem 'Noto Sans KR';background:var(--cl);color:var(--cd);border-radius:10px;padding:0 9px}
.lc .hk{position:absolute;right:7px;top:7px}
.lc .em{font-size:2.5rem;line-height:1.25;margin-top:6px}
.lc .w{font:500 1.2rem 'Fredoka'}
.lc .w b{color:var(--c);font-weight:700}
.lc.on{background:var(--cl)}
.cnt-line{text-align:center;color:var(--sub);font-size:.9rem;margin-top:18px}

/* word cards */
.wg{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.wc{background:#fff;border:3px solid var(--c);border-radius:20px;box-shadow:0 5px 0 var(--cd);padding:10px 8px 14px;text-align:center}
.wc.done{background:var(--cl)}
.wc .pe{font-size:3rem;line-height:1.2;position:relative;padding:0 26px}
.wc .pe span{position:absolute;right:-4px;top:4px;font-size:1.1rem}
.tls{display:flex;justify-content:center;gap:7px;margin-top:6px}
.tl{width:56px;height:84px;border-radius:14px;border:3px solid var(--gr);background:#fff;box-shadow:0 4px 0 var(--gr);font:600 2rem/1 'Fredoka';display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.tl.v{border-color:var(--c);color:var(--cd)}
.tl small{font:700 1.25rem 'Noto Sans KR';color:var(--sub);visibility:hidden}
.tl.on{background:var(--cl)}
.tl.on small{visibility:visible}

/* build */
.bd{text-align:center}
.slots{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin:20px 0 22px;min-height:64px}
.slot{min-width:62px;height:66px;border-bottom:4px solid var(--gr);border-radius:12px 12px 0 0;background:#FDF3F7;font:600 2.3rem 'Fredoka';display:flex;align-items:center;justify-content:center}
.slot.fill{background:var(--okl);border-color:var(--ok);color:#14703d}
.slot.cur{border-color:var(--c);background:var(--cl)}
.pool{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.tok{background:#fff;border:3px solid var(--c);border-radius:16px;min-width:66px;padding:6px 12px;font:600 2.2rem/1.1 'Fredoka';box-shadow:0 5px 0 var(--cd);transition:transform .08s}
.tok small{display:block;font:700 1.3rem 'Noto Sans KR';color:var(--sub)}
.tok:active{transform:translateY(3px);box-shadow:0 2px 0 var(--cd)}
.tok.used{visibility:hidden}

/* memory */
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:760px;margin:0 auto}
.mm{height:112px;border-radius:18px;border:3px solid var(--cd);background:var(--c);color:#fff;font:700 2.2rem 'Fredoka';box-shadow:0 5px 0 var(--cd);transition:transform .12s}
.mm.up{background:#fff;color:var(--cd)}
.mm.up.pic{font-size:3.2rem}
.mm.ok{background:var(--okl);border-color:var(--ok);box-shadow:none;transform:translateY(5px);color:#14703d;pointer-events:none}
.mtry{text-align:center;color:var(--sub);margin-top:14px;font-size:.9rem}

/* balloons */
.sky{display:flex;flex-wrap:wrap;justify-content:center;gap:34px 26px;padding:18px 0 34px;max-width:640px;margin:0 auto}
.bl{width:86px;height:104px;border-radius:50% 50% 47% 47%;background:var(--bc);color:#fff;font:700 2.4rem 'Fredoka';position:relative;
  box-shadow:inset -9px -11px 0 rgba(0,0,0,.13);animation:float 3s ease-in-out infinite;text-shadow:0 2px 0 rgba(0,0,0,.15)}
.bl::before{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-6px;border:6px solid transparent;border-bottom-color:var(--bc);transform:rotate(180deg);transform-origin:50% 25%}
.bl::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:26px;background:#d8b9c6;margin-top:5px}
@keyframes float{50%{transform:translateY(-12px)}}
.bl.shake{animation:shake .35s}
.bl.pop{animation:boom .35s forwards;pointer-events:none}
@keyframes boom{to{transform:scale(1.7);opacity:0}}

/* falling balloons */
.fhead{display:flex;justify-content:flex-end;margin-bottom:8px}
.fs{font:700 1.2rem 'Fredoka';background:#fff;border:2px solid var(--gold);color:#8a5a00;border-radius:99px;padding:4px 16px}
.field{position:relative;height:clamp(380px,52vh,560px);overflow:hidden;border-radius:20px;background:linear-gradient(#EAF6FF,#FFF4F8);border:2px dashed var(--line)}
.field .bl{position:absolute;top:-120px}
.bl.ko{font:700 2.2rem 'Noto Sans KR'}
.base{display:flex;align-items:center;justify-content:center;gap:20px;margin-top:14px;background:var(--cl);border-radius:20px;padding:10px}
.base .pe{font-size:3.4rem;line-height:1.1}
.tgt{font:600 3.2rem/1 'Fredoka';color:var(--cd);background:#fff;border:4px solid var(--c);border-radius:20px;padding:10px 24px}
.tgt.ko{font:700 3.2rem/1 'Noto Sans KR'}

.pe .kos{display:block;font:700 1.2rem/1.3 'Noto Sans KR';font-style:normal;color:var(--sub)}
.lc .ko,.wc .ko{font:700 1rem 'Noto Sans KR';color:var(--sub);margin:0 0 4px}
.opt .kox{display:block;font:700 1.05rem 'Noto Sans KR';font-style:normal;color:var(--sub);line-height:1.3}

/* level 2 */
.map{grid-template-columns:repeat(3,1fr)}
.hid small{visibility:hidden}
.hid.showhint small{visibility:visible}
.wd small{display:block;font:700 1.4rem 'Noto Sans KR';letter-spacing:5px;color:var(--sub);margin-top:2px}
.wg{grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.tl{width:46px}
.tl.two{width:64px}
.wc .ko{font:700 1.05rem 'Noto Sans KR';color:var(--sub);margin:0 0 6px}
.kom{font:700 1.3rem 'Noto Sans KR';color:var(--sub);margin-top:2px;min-height:1.4em}
.opt .kox{display:block;font:700 1.05rem 'Noto Sans KR';font-style:normal;color:var(--sub);line-height:1.3}
.bl.wb{width:150px;height:92px;border-radius:46px;font-size:1.9rem}
@media (max-width:600px){.map{grid-template-columns:1fr}}

/* level 3 */
.wg{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.tls{gap:5px}
.tl.mute{border-style:dashed;color:#b9a3af}
.mg{margin-top:10px}
/* picture puzzle */
.pz{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:22px;align-items:start}
.pzb svg{display:block;width:100%;border-radius:18px;border:4px solid var(--c);box-shadow:0 6px 0 var(--cd);background:#fff;overflow:hidden}
.pzp g{cursor:pointer}
.pzp path{fill:var(--cl);stroke:#fff;stroke-width:3;stroke-linejoin:round;transition:fill-opacity .6s,stroke-opacity .8s}
.pzp text{font:600 26px 'Fredoka';fill:var(--c);text-anchor:middle;pointer-events:none;transition:opacity .3s}
.pzp g.sel path{fill:#FFE9A8;stroke:var(--c)}
.pzp g.open{pointer-events:none}
.pzp g.open path{fill-opacity:0}
.pzp g.open text{opacity:0}
.pzb.all .pzp path{stroke-opacity:0}
.pzname{font:400 1.4rem 'Jua';text-align:center;color:var(--cd);margin-top:12px;min-height:1.6em}
.pzq{min-height:300px}
.pzq .opt .lt{font-size:2.1rem}
.pzq .wd{font-size:3rem}
.pzmsg{font:400 1.35rem/1.5 'Jua','Noto Sans KR';color:var(--cd);padding:70px 10px 0}
@media (max-width:900px){.pz{grid-template-columns:1fr}.pzb{max-width:380px;margin:0 auto;width:100%}.pzmsg{padding-top:20px}.pzq{min-height:0}.pzq .opt.pic{font-size:3.2rem}}

/* result */
#fx{position:fixed;inset:0;pointer-events:none;z-index:90;overflow:hidden}
#fx i{position:absolute;top:-20px;width:11px;height:16px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.modal{position:fixed;inset:0;background:rgba(60,20,45,.55);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px}
.modal .box{background:#fff;border-radius:30px;padding:30px 40px 32px;text-align:center;max-width:520px;width:100%;border:4px solid var(--c);box-shadow:0 10px 0 var(--cd);animation:pop .35s}
.modal .big{font-size:3.4rem;letter-spacing:8px;color:#e6d3dc;line-height:1.2}
.modal .big b{color:var(--gold);font-weight:400;display:inline-block;animation:pop .5s backwards}
.modal h2{font-family:'Jua';font-weight:400;font-size:1.8rem;margin-top:4px}
.modal p{color:var(--sub);margin-top:4px}
.modal .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}
@media (max-width:900px){
  html{font-size:16px}.lgd{grid-template-columns:repeat(4,1fr)}
  .hero svg{width:110px;right:24px}.hero h1{font-size:2.7rem}
}
@media (max-width:600px){

const tileCls = (x, i) => (x.k[i] === MUTE ? " mute" : isVow(x.g[i]) ? " v" : "") + (wide(x, i) ? " two" : "");      // 글자 칸: 모음은 색, 소리 없는 e는 점선

  const grid = h("div", { class: "wg" });

// 한 문제: 4개 중에 고르기. 한글 힌트는 숨겨 두었다가 한 번 틀리면 보여 준다.
// 틀리면 on.miss, 맞히면 곧바로 on.right, 단어 소리를 들려준 뒤 on.next
function ask(box, it, on) {
  box.innerHTML = ""; box.classList.remove("showhint");
  if (it.auto) box.append(h("div", { class: "lqh" }, speaker(it.say)));
  if (it.word) box.append(h("div", { class: "wd" }, it.word, h("small", null, it.hint)));
  const grid = h("div", { class: "opts", style: { gridTemplateColumns: `repeat(${it.cols},1fr)` } });
  const note = h("div", { class: "kom" });        // 맞힌 뒤 보여 주는 그림·뜻
  shuffle(it.opts.map((t, k) => ({ t, k }))).forEach(o => {
    const b = h("button", { class: "opt" + (it.pic ? " pic" : ""), type: "button", html: o.t, onclick: () => {
      if (o.k === 0) {
        b.classList.add("ok", "pop"); grid.querySelectorAll(".opt").forEach(x => x.disabled = true);
        box.classList.add("showhint"); sfx.ok(); note.textContent = it.ans || "";
        if (on.right) on.right();
        later(() => say(it.say), 300); later(on.next, 1700);
      } else { b.classList.add("no", "shake"); b.disabled = true; on.miss(); sfx.no(); box.classList.add("showhint"); }
    } });
    grid.append(b);
  });
  box.append(grid, note);
  if (it.auto) later(() => say(it.say), 400);
}
ENG.pick = (host, cfg, done) => {
  const items = cfg.gen();
  let i = 0, miss = 0;
  const bar = progress(host, items.length), box = h("div", { class: "lq hid" });
  host.append(box);
  function show() {
    if (i >= items.length) return done(miss, items.length);
    bar.set(i);
    ask(box, items[i], { miss: () => miss++, next: () => { i++; show(); } });
  }
  show();
};

ENG.build = (host, cfg, done) => {
  const items = shuffle(WORDS[cfg.set]).slice(0, 8);
  const allG = [...new Set(ALLW.flatMap(x => x.g))];
  let i = 0, miss = 0;
  const bar = progress(host, items.length), box = h("div", { class: "bd lq hid" });
  host.append(box);
  function show() {
    if (i >= items.length) return done(miss, items.length * 3);
    bar.set(i);
    const it = items[i], toks = it.g;
    let pos = 0;
    box.innerHTML = ""; box.classList.remove("showhint");
    box.append(h("div", { class: "lqh" }, h("div", { class: "pe" }, it.e, h("em", { class: "kos" }, it.ko)), speaker(it.w)));
    const slots = toks.map(() => h("span", { class: "slot" }));
    slots[0].classList.add("cur");
    const pool = h("div", { class: "pool" });
    // 함정 글자 2개: 단어에 없고, 단어 속 글자와 한글 힌트(소리)가 겹치지 않는 것
    const traps = shuffle(allG.filter(g => !toks.includes(g) && !it.k.includes(HK[g]))).slice(0, 2);
    shuffle(toks.map((t, k) => ({ t, k: it.k[k] })).concat(traps.map(t => ({ t, k: HK[t] })))).forEach(({ t, k }) => {
      const b = h("button", { class: "tok", type: "button" }, t, h("small", null, k));
      b.onclick = () => {
        if (t !== toks[pos]) { miss++; sfx.no(); shakeIt(b); box.classList.add("showhint"); return; }
        slots[pos].textContent = t; slots[pos].classList.remove("cur"); slots[pos].classList.add("fill");
        b.classList.add("used"); b.disabled = true; pos++;
        if (pos < toks.length) { slots[pos].classList.add("cur"); sfx.tap(); return; }
        sfx.ok(); later(() => say(it.w), 250);
        later(() => { i++; show(); }, 1700);
      };
      pool.append(b);
    });
    box.append(h("div", { class: "slots" }, slots), pool);
    later(() => say(it.w), 400);
  }
  show();
};

// 가로 cols × 세로 rows 조각으로 나눈 퍼즐 모양. 맞닿은 두 조각은 같은 볼록이를 한쪽은 튀어나오게, 한쪽은 들어가게 쓴다.
function jigsaw(cols, rows, W, H) {
  const pw = W / cols, ph = H / rows, r = Math.min(pw, ph) * .15, sign = () => (Math.random() < .5 ? 1 : -1);
  const V = Array.from({ length: rows }, () => Array.from({ length: cols - 1 }, sign));      // 세로 경계: +1 오른쪽으로, -1 왼쪽으로 볼록
  const HZ = Array.from({ length: rows - 1 }, () => Array.from({ length: cols }, sign));     // 가로 경계: +1 아래로, -1 위로 볼록
  const edge = (x1, y1, x2, y2, bx, by) => {              // (x1,y1)→(x2,y2) 한 변. (bx,by) 쪽으로 볼록, 둘 다 0이면 곧은 변
    if (!bx && !by) return `L${x2} ${y2}`;
    const dx = x2 - x1, dy = y2 - y1;
    return `L${x1 + dx * .38} ${y1 + dy * .38}A${r} ${r} 0 1 ${bx * dy - by * dx > 0 ? 1 : 0} ${x1 + dx * .62} ${y1 + dy * .62}L${x2} ${y2}`;
  };
  const out = [];
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
    const x0 = x * pw, y0 = y * ph, x1 = x0 + pw, y1 = y0 + ph;
    out.push({ cx: x0 + pw / 2, cy: y0 + ph / 2, d: `M${x0} ${y0}` + edge(x0, y0, x1, y0, 0, y ? HZ[y - 1][x] : 0) + edge(x1, y0, x1, y1, x < cols - 1 ? V[y][x] : 0, 0) +
      edge(x1, y1, x0, y1, 0, y < rows - 1 ? HZ[y][x] : 0) + edge(x0, y1, x0, y0, x ? V[y][x - 1] : 0, 0) + "Z" });
  }
  return out;
}
ENG.puzzle = (host, cfg, done) => {
  const N = 12, scene = SCENES[cfg.set], pool = WORDS[cfg.set];
  // 문제는 '듣고 단어 고르기'와 '읽고 그림 고르기'를 반씩 섞는다
  const items = shuffle(shuffle(pool).slice(0, N).map((x, k) => Object.assign(k % 2 ? readItem(x, pool) : listenItem(x, pool), { cols: 2 })));
  let i = 0, miss = 0, sel = null, asking = false;
  const board = h("div", { class: "pzb", html: `<svg viewBox="0 0 400 300">${scene.svg}<g class="pzp">` +
    jigsaw(4, 3, 400, 300).map(p => `<g><path d="${p.d}"/><text x="${p.cx}" y="${p.cy + 9}">?</text></g>`).join("") + "</g></svg>" });
  const name = h("div", { class: "pzname" }), box = h("div", { class: "lq hid pzq" });
  host.append(h("div", { class: "pz" }, h("div", null, board, name), box));
  const cells = [...board.querySelectorAll(".pzp g")];
  const tell = t => { box.innerHTML = ""; box.append(h("div", { class: "pzmsg" }, t)); };
  const question = () => { asking = true; ask(box, items[i], { miss: () => miss++, right: paint, next }); };
  function paint() {                                      // 맞히자마자 고른 조각에 색칠
    sel.classList.remove("sel"); sel.classList.add("open"); sel = null; i++;
    name.textContent = `🎨 ${i} / ${N}`;
  }
  function next() {
    asking = false;
    if (i >= N) {
      board.classList.add("all"); name.textContent = scene.name;
      tell("🎉 숨은 그림을 다 찾았어요!");
      return doneBar(box, "다 봤어요 ✓", () => done(miss, N));
    }
    if (sel) question(); else tell("👆 다음 조각을 골라요!");      // 소리가 나는 동안 벌써 다음 조각을 골랐으면 바로 문제
  }
  cells.forEach(g => g.addEventListener("click", () => {
    if (g.classList.contains("open") || i >= N) return;
    cells.forEach(o => o.classList.toggle("sel", o === g));
    g.parentNode.append(g);                               // 고른 조각의 테두리가 다른 조각 위에 보이게
    sel = g; sfx.tap();
    if (!asking) question();
  }));
  name.textContent = `🎨 0 / ${N}`;
  tell("👆 색칠하고 싶은 조각을 눌러요!");
};

// 내려오는 단어 풍선: 아래 그림에 맞는 단어를 터뜨린다. 정답 풍선은 화면에 하나만, 하나 맞히면 다음 그림.
const COLORS = ["#FF6B8A", "#FFB020", "#4CC9F0", "#5CC98A", "#9B5DE5", "#FF7A45", "#F0508A", "#3FA7F5"];
ENG.fall = (host, cfg, done) => {
  const GOAL = 10, FALL_MS = 8000, BW = 150;
  const run = RUN, words = WORDS[cfg.set], targets = shuffle(words);
  let x = targets[0], ti = 0, score = 0, miss = 0, balls = [], stop = false, pauseUntil = 0, decoys = [];
  const scoreEl = h("span", { class: "fs" }), field = h("div", { class: "field" }), base = h("div", { class: "base" });
  host.append(h("div", { class: "fhead" }, scoreEl), field, base);
  const setScore = () => scoreEl.textContent = `⭐ ${score} / ${GOAL}`;
  function showTarget() {
    base.innerHTML = "";
    base.append(h("div", { class: "pe" }, x.e, h("em", { class: "kos" }, x.ko)), speaker(x.w));
    decoys = near(x, words, 6);
    later(() => say(x.w), 300);
  }
  function nextTarget() {
    x = targets[++ti % targets.length];
    balls.forEach(b => { b.gone = true; b.el.style.transition = "opacity .3s"; b.el.style.opacity = "0"; setTimeout(() => b.el.remove(), 300); });
    balls = []; pauseUntil = performance.now() + 1200;
    showTarget();
  }
  function spawn() {
    const W = field.clientWidth, lanes = Math.max(2, Math.floor(W / (BW + 16)));
    const busy = new Set(balls.filter(b => b.y < 150).map(b => b.lane));
    const free = [...Array(lanes).keys()].filter(l => !busy.has(l));
    if (!free.length) return;
    const lane = free[Math.random() * free.length | 0];
    const ok = !balls.some(b => b.ok) && (balls.length > 0 || Math.random() < .4);
    const o = ok ? x : shuffle(decoys.filter(d => !balls.some(b => b.o === d)))[0];
    if (!o) return;
    const el = h("button", { class: "bl wb", type: "button",
      style: { "--bc": COLORS[Math.random() * COLORS.length | 0], left: ((lane + .5) * W / lanes - BW / 2) + "px", animationDelay: (-Math.random() * 3).toFixed(2) + "s" } }, o.w);
    const b = { el, ok, o, lane, y: -120, gone: false };
    el.onclick = () => {
      if (b.gone || stop) return;
      if (!b.ok) { miss++; sfx.no(); shakeIt(el); return; }
      b.gone = true; balls = balls.filter(q => q !== b);
      el.classList.add("pop"); setTimeout(() => el.remove(), 400);
      sfx.ok(); score++; setScore(); pauseUntil = performance.now() + 2000;
      if (score >= GOAL) { stop = true; later(() => done(miss, GOAL), 900); }
      else later(nextTarget, 350);
    };
    field.append(el); balls.push(b);
  }
  let prev = performance.now(), nextSpawn = prev + 700;
  function frame(now) {
    if (run !== RUN || stop || !document.body.contains(field)) return;
    const dt = Math.min(1000, now - prev), H = field.clientHeight;   // 화면 갱신이 느린 기기에서도 실제 시간만큼 내려온다
    prev = now;
    balls = balls.filter(b => {
      b.y += (H + 120) / FALL_MS * dt; b.el.style.top = b.y + "px";
      if (b.y > H) { b.el.remove(); return false; }
      return true;
    });
    if (now >= nextSpawn && now >= pauseUntil) { spawn(); nextSpawn = now + 1700 + Math.random() * 700; }
    requestAnimationFrame(frame);
  }
  setScore(); showTarget(); requestAnimationFrame(frame);
};
